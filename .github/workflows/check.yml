name: Check theme
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/embed-font.mjs
      - run: npm run palettes
      - run: git diff --exit-code -- font.css themes palettes package.json design/palette-contrast.txt
      - run: npm exec --yes --package=bb-app@0.43.0 -- bb plugin build
